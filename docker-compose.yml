name: student-football-league

x-migration-job: &migration-job
  profiles: [apps]
  restart: "no"
  pull_policy: never
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfl_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sfl_pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfl}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sfl-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sfl_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    profiles: [apps]
    image: sfl/auth-service:local
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_auth
      ACCOUNT_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_user
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-in-production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      ORGANIZATION_SERVICE_URL: http://organization-service:3004
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-not-for-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      notification-service:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  auth-migrate:
    <<: *migration-job
    image: sfl/auth-service:local
    command: ["node", "services/auth-service/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_auth
      ACCOUNT_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_user

  demo-seed:
    profiles: [demo]
    image: sfl/auth-service:local
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    command: ["node", "services/auth-service/dist/db/seedDemo.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      organization-migrate:
        condition: service_completed_successfully
      tournament-service:
        condition: service_healthy
      tournament-migrate:
        condition: service_completed_successfully
      match-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
      ACCOUNT_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_user
      ORGANIZATION_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_team
      TOURNAMENT_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_tournament
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_match
      SCHEDULING_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_scheduling

  hcm-school-demo-seed:
    profiles: [hcm-demo]
    image: sfl/auth-service:local
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    command: ["node", "services/auth-service/dist/db/seedHcmSchoolDemo.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      organization-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
      ACCOUNT_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_user
      ORGANIZATION_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_team

  tournament-service:
    profiles: [apps]
    image: sfl/tournament-service:local
    build:
      context: .
      dockerfile: services/tournament-service/Dockerfile
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_tournament
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-in-production}
      ORGANIZATION_SERVICE_URL: http://organization-service:3004
      MATCH_SERVICE_URL: http://match-service:3005
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      tournament-migrate:
        condition: service_completed_successfully
      organization-service:
        condition: service_healthy
      match-service:
        condition: service_healthy
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  tournament-migrate:
    <<: *migration-job
    image: sfl/tournament-service:local
    command: ["node", "services/tournament-service/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_tournament

  organization-service:
    profiles: [apps]
    image: sfl/organization-service:local
    build:
      context: .
      dockerfile: services/organization-service/Dockerfile
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_team
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-in-production}
      TOURNAMENT_SERVICE_URL: http://tournament-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      organization-migrate:
        condition: service_completed_successfully
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  organization-migrate:
    <<: *migration-job
    image: sfl/organization-service:local
    command: ["node", "services/organization-service/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_team

  match-service:
    profiles: [apps]
    image: sfl/match-service:local
    build:
      context: .
      dockerfile: services/match-service/Dockerfile
    environment:
      PORT: 3005
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_match
      SCHEDULING_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_scheduling
      DISCIPLINE_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_discipline
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-in-production}
      TOURNAMENT_SERVICE_URL: http://tournament-service:3003
      ORGANIZATION_SERVICE_URL: http://organization-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      match-migrate:
        condition: service_completed_successfully
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  match-migrate:
    <<: *migration-job
    image: sfl/match-service:local
    command: ["node", "services/match-service/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_match
      SCHEDULING_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_scheduling
      DISCIPLINE_DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_discipline

  notification-service:
    profiles: [apps]
    image: sfl/notification-service:local
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      PORT: 3006
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_notification
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-in-production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-${EMAIL_FROM:-${SMTP_USER:-}}}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sân Cỏ}
    depends_on:
      postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    ports:
      - "3006:3006"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  notification-migrate:
    <<: *migration-job
    image: sfl/notification-service:local
    command: ["node", "services/notification-service/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfl}:${POSTGRES_PASSWORD:-sfl_dev_password}@postgres:5432/sfl_notification

  api-gateway:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:3001
      TOURNAMENT_SERVICE_URL: http://tournament-service:3003
      ORGANIZATION_SERVICE_URL: http://organization-service:3004
      MATCH_SERVICE_URL: http://match-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    depends_on:
      auth-service:
        condition: service_healthy
      tournament-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      match-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web-client:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  sfl_pg_data:
  sfl_redis_data:
