server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_gateway api-gateway:8080;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json;

  # Automatic scheduling may use a two-minute search budget. Keep this longer
  # response timeout specific to that operation; normal API routes are unchanged.
  location ~ ^/api/tournaments/[^/]+/schedules/automatic-preview/?$ {
    proxy_pass http://$api_gateway;
    proxy_http_version 1.1;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
  }

  location /api/ {
    proxy_pass http://$api_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
  }

  location /health {
    proxy_pass http://$api_gateway/health;
  }

  location / {
    # Revalidate the SPA shell after a deployment; hashed assets keep their own URLs.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
