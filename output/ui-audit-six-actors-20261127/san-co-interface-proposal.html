};
let role='referee',page='overview',tab=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(items){return '<div class="sc-rows">'+items.map(x=>'<div class="sc-row"><strong>'+esc(x[0])+'</strong><span>'+esc(x[1])+'</span></div>').join('')+'</div>';}
function panel(title,items){return '<section class="sc-panel"><header><h2>'+esc(title)+'</h2></header>'+rows(items)+'</section>';}
function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{actor:actors[role].label,screen:labels[page][0]},privateContent:{role,page,tab}}).catch(()=>{});}
function render(){const a=actors[role];root.querySelector('#sc-space').textContent=a.space;root.querySelector('#sc-actor-label').textContent=a.label;root.querySelector('#sc-breadcrumb').textContent=a.label+' / '+labels[page][0];
root.querySelector('#sc-actors').innerHTML=Object.entries(actors).map(([id,x])=>'<button type="button" class="cursor-interaction" data-actor="'+id+'" aria-pressed="'+(role===id)+'">'+x.label+'</button>').join('');
root.querySelector('#sc-nav').innerHTML=a.nav.map(([group,items])=>'<div class="sc-nav-group">'+group+'</div>'+items.map(id=>'<button type="button" class="cursor-interaction" data-page="'+id+'"'+(page===id?' aria-current="page"':'')+'><i data-lucide="'+labels[id][1]+'" aria-hidden="true"></i><span>'+labels[id][0]+'</span></button>').join('')).join('');
let html='<div class="sc-heading"><span class="sc-eyebrow">'+a.space+'</span><h1>'+labels[page][0]+'</h1><p class="sc-subtitle">'+(page==='overview'?'Xin chào. Công việc và thông tin theo đúng không gian của bạn.':'Thông tin và thao tác theo quyền hiện có của '+a.label.toLowerCase()+'.')+'</p></div>';
if(page==='overview'){html+='<div class="sc-metrics">'+a.metrics.map(x=>'<article class="sc-metric"><span>'+x+'</span><strong>—</strong></article>').join('')+'</div><div class="sc-cols"><div class="sc-stack">'+panel(a.main,a.rows)+'<section class="sc-panel"><header><h2>Truy cập theo ngữ cảnh</h2></header><div class="sc-rows"><div class="sc-flow sc-row">'+a.flow.map(x=>'<span>'+x+'</span>').join('')+'</div></div></section></div><aside class="sc-stack"><section class="sc-panel"><header><h2>'+(role==='referee'?'Quy trình tác nghiệp':'Công việc & truy cập nhanh')+'</h2></header><ol class="sc-tasks">'+a.tasks.map((x,i)=>'<li><i>'+(i+1)+'</i><span>'+x+'</span></li>').join('')+'</ol></section>'+panel('Thông báo mới',[['Nội dung của tài khoản','Theo dữ liệu và quyền xem hiện có']])+'</aside></div>';}
else {const p=pages[page];let tabs=page==='tournaments'&&role==='btc'?['Tất cả giải đấu','Giải đấu của tôi']:p.tabs;if(page==='roles'&&role!=='captain')tabs=tabs.slice(0,2);const pageRows=[...p.rows];if(page==='matches'&&role==='admin')pageRows.push(['Giám sát bất thường hiện có','Gửi yêu cầu tạm dừng có lý do → BTC phụ trách xét duyệt']);if(page==='matches'&&role==='btc')pageRows.push(['Yêu cầu tạm dừng trận','Xem xét · Chấp thuận / từ chối theo nghiệp vụ hiện có']);tab=Math.min(tab,tabs.length-1);html+='<section class="sc-panel"><div class="sc-tabs" role="group" aria-label="Các vùng nội dung đề xuất">'+tabs.map((x,i)=>'<button type="button" class="cursor-interaction" data-tab="'+i+'" aria-pressed="'+(i===tab)+'">'+x+'</button>').join('')+'</div><div class="sc-filter"><i data-lucide="search" aria-hidden="true"></i>Bộ lọc theo chức năng hiện có</div>'+rows(pageRows)+'<div class="sc-detail"><h2>'+tabs[tab]+'</h2><div class="sc-flow">'+a.flow.map(x=>'<span>'+x+'</span>').join('')+'</div>'+(page==='tournaments'&&role==='btc'?'<div class="sc-readonly">Giải đấu của tôi → Workspace 8 bước; giữ nguyên giao diện Bước 3–6 đã chốt.</div>':page==='approvals'?'<div class="sc-readonly">Ba nghiệp vụ độc lập. Nút xử lý tuân theo quyền hiện tại của từng loại yêu cầu.</div>':'')+'</div></section>';}
html+='<div class="sc-bottom-note">Bố cục đề xuất · Dấu “—” là vị trí số liệu · Không kết nối hoặc ghi dữ liệu hệ thống</div>';root.querySelector('#sc-content').innerHTML=html;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function restore(saved){const s=saved?.privateContent;if(s&&actors[s.role]){role=s.role;const allowed=actors[role].nav.flatMap(x=>x[1]);page=allowed.includes(s.page)?s.page:'overview';tab=Number.isInteger(s.tab)?Math.max(0,s.tab):0;}render();}
root.addEventListener('click',e=>{const a=e.target.closest('[data-actor]'),p=e.target.closest('[data-page]'),t=e.target.closest('[data-tab]');if(a){role=a.dataset.actor;page='overview';tab=0;}else if(p){page=p.dataset.page;tab=0;}else if(t){tab=Number(t.dataset.tab);}else return;render();remember();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});restore(window.openai?.widgetState);
})();
</script>
